name: Discover image variants

env:
  LIBC_VARIANTS: glibc musl

on:
  workflow_call:
    outputs:
      images:
        description: Available image variants as a JSON array
        value: ${{ jobs.discover.outputs.images }}

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover Containerfiles
        id: matrix
        shell: bash
        run: |
          read -r -a libc_variants <<< "$LIBC_VARIANTS"
          images='[]'
          for addon_dir in addons/*/*/; do
            [[ -d "$addon_dir" ]] || continue
            addon_dir="${addon_dir%/}"
            addon="${addon_dir##*/}"
            variants='[]'
            if [[ -f "${addon_dir}/Containerfile" ]]; then
              variants=$(jq -cn --arg containerfile "${addon_dir}/Containerfile" \
                '[{containerfile: $containerfile}]')
            fi
            for libc in "${libc_variants[@]}"; do
              containerfile="${addon_dir}/Containerfile.${libc}"
              if [[ ! -f "$containerfile" ]]; then
                echo "::notice::Skipping ${addon_dir}/${libc}: no Containerfile"
                continue
              fi
              if [[ -f "${addon_dir}/Containerfile" ]]; then
                echo "::error::${addon_dir} mixes a plain Containerfile with libc variants"
                exit 1
              fi
              variants=$(jq -c \
                --arg libc "$libc" \
                --arg containerfile "$containerfile" \
                '. + [{libc: $libc, containerfile: $containerfile}]' \
                <<< "$variants")
            done
            if [[ "$variants" == '[]' ]]; then
              echo "::notice::Skipping ${addon_dir}: no supported Containerfiles"
              continue
            fi
            if jq -e --arg suffix "$addon" 'any(.[]; .suffix == $suffix)' \
              <<< "$images" >/dev/null; then
              echo "::error::Duplicate addon name ${addon}: names must be unique across categories"
              exit 1
            fi
            images=$(jq -c \
              --arg suffix "$addon" \
              --arg context . \
              --argjson variants "$variants" \
              '. + [{suffix: $suffix, context: $context, variants: $variants}]' \
              <<< "$images")
          done

          if [[ "$images" == '[]' ]]; then
            echo "::error::No supported image Containerfiles found"
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
