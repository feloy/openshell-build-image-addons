name: Discover image variants

env:
  LIBC_VARIANTS: glibc musl

on:
  workflow_call:
    inputs:
      changed-only:
        type: boolean
        default: false
        description: Select only images affected by pull request or push changes
    outputs:
      images:
        description: Selected addon images as a JSON array
        value: ${{ jobs.discover.outputs.images }}
      builder:
        description: Release asset used to verify the selected addons
        value: ${{ jobs.discover.outputs.builder }}

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.select.outputs.images }}
      builder: ${{ steps.builder.outputs.asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-only && '0' || '1' }}

      - name: Discover Containerfiles
        id: matrix
        shell: bash
        run: |
          read -r -a libc_variants <<< "$LIBC_VARIANTS"
          images='[]'
          for addon_dir in addons/*/*/; do
            [[ -d "$addon_dir" ]] || continue
            addon_dir="${addon_dir%/}"
            addon="${addon_dir##*/}"
            variants='[]'
            if [[ -f "${addon_dir}/Containerfile" ]]; then
              for containerfile in "${addon_dir}"/Containerfile.*; do
                if [[ -f "$containerfile" ]]; then
                  echo "::error::${addon_dir} mixes a plain Containerfile with libc variants"
                  exit 1
                fi
              done
              variants=$(jq -cn --arg containerfile "${addon_dir}/Containerfile" \
                '[{containerfile: $containerfile}]')
            else
              for libc in "${libc_variants[@]}"; do
                containerfile="${addon_dir}/Containerfile.${libc}"
                if [[ ! -f "$containerfile" ]]; then
                  echo "::notice::Skipping ${addon_dir}/${libc}: no Containerfile"
                  continue
                fi
                variants=$(jq -c \
                  --arg libc "$libc" \
                  --arg containerfile "$containerfile" \
                  '. + [{libc: $libc, containerfile: $containerfile}]' \
                  <<< "$variants")
              done
            fi
            if [[ "$variants" == '[]' ]]; then
              echo "::notice::Skipping ${addon_dir}: no supported Containerfiles"
              continue
            fi
            if jq -e --arg suffix "$addon" 'any(.[]; .suffix == $suffix)' \
              <<< "$images" >/dev/null; then
              echo "::error::Duplicate addon name ${addon}: names must be unique across categories"
              exit 1
            fi
            images=$(jq -c \
              --arg suffix "$addon" \
              --arg context . \
              --arg manifest "$addon_dir/addon.yaml" \
              --argjson variants "$variants" \
              '. + [{suffix: $suffix, context: $context, manifest: $manifest, variants: $variants}]' \
              <<< "$images")
          done

          if [[ "$images" == '[]' ]]; then
            echo "::error::No supported image Containerfiles found"
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Select images
        id: select
        env:
          IMAGES_JSON: ${{ steps.matrix.outputs.images }}
          CHANGED_ONLY: ${{ inputs.changed-only }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          images="$IMAGES_JSON"
          if [[ "$CHANGED_ONLY" == true ]]; then
            if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::notice::Base commit unavailable; selecting all images"
              echo "images=$images" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            diff_range="$BASE_SHA..$HEAD_SHA"
            if [[ "$EVENT_NAME" == pull_request ]]; then
              diff_range="$BASE_SHA...$HEAD_SHA"
            fi
            changed_paths=$(git diff --name-only --no-renames "$diff_range" --)
            addons=$(
              while IFS= read -r path; do
                case "$path" in
                  addons/*/*/Containerfile*|addons/*/*/install.sh|\
                  addons/*/*/addon.yaml|addons/*/*/inventory.json)
                    addon="${path#addons/*/}"
                    echo "${addon%%/*}"
                    ;;
                  scripts/install-bun.sh|scripts/build-acp.sh)
                    printf '%s\n' claude codex
                    ;;
                  .github/workflows/pr-check.yaml|.github/workflows/next-build.yaml|\
                  .github/workflows/image-matrix.yaml|\
                  .github/workflows/oci-image.yaml|.github/scripts/build-addon-index.sh|\
                  .github/scripts/verify-addon.sh|\
                  .containerignore|.dockerignore)
                    echo '*'
                    ;;
                esac
              done <<< "$changed_paths" | jq -Rsc 'split("\n") | map(select(length > 0)) | unique'
            )
            images=$(jq -c --argjson addons "$addons" \
              '[.[] | select(.suffix as $name | $addons | index("*") or index($name))]' \
              <<< "$images")
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Resolve the latest stable image builder release
        if: ${{ steps.select.outputs.images != '[]' }}
        id: builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api repos/openkaiden/openshell-build-image/releases/latest | jq -ce '
            .tag_name as $tag |
            [.assets[] | select(.name == "openshell-build-image-x86_64-unknown-linux-gnu")] |
            if length == 1 and (.[0].digest | test("^sha256:[a-f0-9]{64}$")) then
              .[0] | {tag: $tag, url: .browser_download_url, sha256: (.digest | ltrimstr("sha256:"))}
            else error("latest release has no checksummed Linux x86_64 builder") end
          ')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
