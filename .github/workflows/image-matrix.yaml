name: Discover image variants

env:
  LIBC_VARIANTS: glibc musl

on:
  workflow_call:
    outputs:
      images:
        description: Available image variants as a JSON array
        value: ${{ jobs.discover.outputs.images }}

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover Containerfiles
        id: matrix
        shell: bash
        run: |
          read -r -a libc_variants <<< "$LIBC_VARIANTS"
          images='[]'
          for agent_dir in agents/*/; do
            [[ -d "$agent_dir" ]] || continue
            context="${agent_dir%/}"
            agent="${context##*/}"
            for libc in "${libc_variants[@]}"; do
              containerfile="${context}/Containerfile.${libc}"
              if [[ ! -f "$containerfile" ]]; then
                echo "::notice::Skipping ${agent}-${libc}: no Containerfile"
                continue
              fi
              images=$(jq -c \
                --arg suffix "${agent}-${libc}" \
                --arg containerfile "$containerfile" \
                --arg context "$context" \
                '. + [{suffix: $suffix, containerfile: $containerfile, context: $context}]' \
                <<< "$images")
            done
          done

          if [[ "$images" == '[]' ]]; then
            echo "::error::No supported image Containerfiles found"
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
