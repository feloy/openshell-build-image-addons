name: pr-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/image-matrix.yaml

  build:
    name: Check ${{ matrix.image.suffix }}
    needs: images
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.images) }}
    uses: ./.github/workflows/oci-image.yaml
    with:
      image-suffix: ${{ matrix.image.suffix }}
      containerfile: ${{ matrix.image.containerfile }}
      context: ${{ matrix.image.context }}
