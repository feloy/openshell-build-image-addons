apiVersion: v1
metadata:
  displayName: "Git"
  description: "Statically linked Git with HTTPS support and a bundled CA certificate bundle; works on glibc and musl bases."
  version: "2.56.1"
contents:
  files:
    - /usr/local/bin/git
    - /usr/local/bin/git-receive-pack
    - /usr/local/bin/git-shell
    - /usr/local/bin/git-upload-archive
    - /usr/local/bin/git-upload-pack
    - /usr/local/bin/scalar
    - /usr/local/share/git/ca-certificates.crt
    - /usr/local/share/licenses/curl/COPYING
    - /usr/local/share/licenses/git/COPYING
  directories:
    - /usr/local/libexec/git-core
    - /usr/local/share/git-core/templates
verification:
  inventory: inventory.json
  baseImages:
    - image: registry.access.redhat.com/ubi10/ubi@sha256:87ceab8634a53a36c75a8ba7282f09f11c46ab3e8906db6c6d2b3cd2a7dc4f4e
      libc: glibc
    - image: docker.io/library/alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      libc: musl
  commands:
    - [/usr/local/bin/git, --version]
