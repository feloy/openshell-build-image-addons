metadata:
  displayName: "Node.js 24"
  description: "Node.js 24 runtime with npm, npx, Corepack and headers for native modules."
  version: "24.22.3"

builder:
  packages: [patchelf]

  # Node searches the base image's system libraries before its private copies.
  variants:
    glibc:
      from: node-24-bookworm-slim
      instructions: |
        RUN cp -L /usr/lib/*-linux-gnu/libstdc++.so.6 \
                  /usr/lib/*-linux-gnu/libgcc_s.so.1 /tmp/rootfs/usr/local/lib/node-24/ && \
            patchelf --set-rpath "/lib64:/usr/lib64:/lib/$(uname -m)-linux-gnu:/usr/lib/$(uname -m)-linux-gnu:/lib:/usr/lib:\$ORIGIN/../lib/node-24" \
                /tmp/rootfs/usr/local/bin/node
    musl:
      from: node-24-alpine
      instructions: |
        RUN cp -L /usr/lib/libstdc++.so.6 /usr/lib/libgcc_s.so.1 \
                  /usr/lib/libatomic.so.1 /tmp/rootfs/usr/local/lib/node-24/ && \
            patchelf --set-rpath '/lib:/usr/lib:$ORIGIN/../lib/node-24' /tmp/rootfs/usr/local/bin/node

final:
  instructions: |
    ADD --chmod=0644 --checksum=sha256:5888dbb9a1d2b18f2c3e6c5f6af1b39de658372b402a0577b002777f14c62ace \
        https://raw.githubusercontent.com/nodejs/node/v24.22.3/LICENSE /usr/local/share/licenses/node/LICENSE
  env:
    PATH: /usr/local/bin
