metadata:
  displayName: "OpenCode"
  description: "OpenCode AI coding agent CLI."
  version: &version "2.2.5"

builder:
  variants:
    glibc:
      from: core-runtime-builder
      packages: [gzip, tar]
    musl:
      from: alpine
      packages: [bash, ca-certificates, curl, libgcc, libstdc++]
      instructions: |
        RUN set -eux; \
            mkdir -p /tmp/rootfs/usr/local/lib; \
            cp -P /usr/lib/libstdc++.so.* /usr/lib/libgcc_s.so.* /tmp/rootfs/usr/local/lib/

  env:
    OPENCODE_VERSION: *version

final:
  env:
    PATH: /usr/local/bin
