metadata:
  displayName: "Claude Code"
  description: "Claude Code CLI with the Claude Agent ACP adapter."
  version: &version "2.1.286"

builder:
  variants:
    glibc:
      from: core-runtime-builder
      packages: [git, unzip]
    musl:
      from: alpine
      packages: [bash, ca-certificates, curl, git, libgcc, libstdc++, ripgrep, unzip]

  env:
    CLAUDE_CODE_VERSION: *version
    ACP_OUTPUT: "claude-agent-acp"

  tools: [bun]

  instructions: |
    COPY scripts/build-acp.sh /tmp/build-acp.sh
    RUN HOME=/tmp bash /tmp/build-acp.sh

final:
  env:
    PATH: /usr/local/bin
    CLAUDE_CODE_EXECUTABLE: /usr/local/bin/claude
