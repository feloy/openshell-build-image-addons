metadata:
  displayName: "Codex"
  description: "OpenAI Codex CLI with the Codex ACP adapter."
  version: &version "0.159.3"

builder:
  variants:
    glibc:
      from: core-runtime-builder
      packages: [gawk, git, gzip, tar, unzip]
    musl:
      from: alpine
      packages: [bash, ca-certificates, curl, git, libgcc, libstdc++, ripgrep, unzip]
      instructions: |
        RUN set -eux; \
            cp -P /usr/lib/libstdc++.so.* /usr/lib/libgcc_s.so.* /tmp/rootfs/usr/local/lib/

  env:
    # The ACP adapter requires a compatible Codex version.
    CODEX_VERSION: *version
    ACP_OUTPUT: "codex-acp"

  tools: [bun]

  instructions: |
    COPY scripts/build-acp.sh /tmp/build-acp.sh
    RUN HOME=/tmp bash /tmp/build-acp.sh

final:
  env:
    PATH: /usr/local/bin
    CODEX_PATH: /usr/local/bin/codex
